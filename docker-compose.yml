services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: pixel-retro-game/app
        ports:
            - "8000:8000"
        environment:
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: "${DB_DATABASE}"
            DB_USERNAME: "${DB_USERNAME}"
            DB_PASSWORD: "${DB_PASSWORD:-password}"
        volumes:
            # Código de la app montado para recarga en vivo...
            - ".:/var/www/html"
            # ...pero vendor/ y bootstrap/cache se sirven desde volúmenes
            # internos del contenedor (filesystem rápido), no desde el bind
            # mount de Windows, que es lentísimo para los miles de archivos
            # que el autoloader de PHP lee en cada petición.
            - "app-vendor:/var/www/html/vendor"
            - "app-bootstrap-cache:/var/www/html/bootstrap/cache"
        networks:
            - sail
        depends_on:
            - soketi
            - pgsql
    soketi:
        image: "quay.io/soketi/soketi:latest-16-alpine"
        environment:
            SOKETI_DEBUG: "${SOKETI_DEBUG:-1}"
            SOKETI_METRICS_SERVER_PORT: "9601"
            SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID}"
            SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY}"
            SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET}"
        ports:
            - "${PUSHER_PORT:-6001}:6001"
            - "${PUSHER_METRICS_PORT:-9601}:9601"
        networks:
            - sail
    pgsql:
        image: "postgres:17-alpine"
        ports:
            - "5433:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-secret}"
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
        volumes:
            - "sail-pgsql:/var/lib/postgresql/data"
            - "./vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - "-q"
                - "-d"
                - "${DB_DATABASE}"
                - "-U"
                - "${DB_USERNAME}"
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    app-vendor:
        driver: local
    app-bootstrap-cache:
        driver: local

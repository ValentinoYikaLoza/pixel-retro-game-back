; OPcache para el servidor de desarrollo (proceso PHP de larga vida).
; Cachea el bytecode compilado en memoria para no re-parsear miles de
; archivos de vendor en cada petición. validate_timestamps=1 + freq=0
; revalida por mtime en cada request, así los cambios de código se reflejan
; al instante (vendor vive en un volumen rápido, el coste de stat es bajo).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
